pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,ts,jsx,tsx,json,jsonc,css}"
      run: pnpm biome check --no-errors-on-unmatched {staged_files}
    - name: 교재 오디오·PDF 커밋 막기
      run: scripts/guard-textbook-files.sh {staged_files}

pre-push:
  jobs:
    - name: lint
      run: pnpm lint
    - name: typecheck
      run: pnpm typecheck
    - name: test
      run: pnpm test:run
